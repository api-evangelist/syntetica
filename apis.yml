name: Syntetica
description: 'Syntetica is a French cleantech company using green chemistry to close
  the loop on synthetic textiles, starting with nylon. Its proprietary chemical process
  depolymerises nylon-blend fabrics, separating and purifying Nylon 6 and Nylon 6,6
  from elastane, cotton, and other fibres in a single process to produce virgin-quality,
  low-carbon recycled polymers that drop in as replacements for fossil-derived nylon
  across textile, automotive, and high-performance applications. Backed by EQT Ventures,
  Bpifrance, SWEN Capital Partners, lululemon, and MAS Holdings, the company raised
  a $30M Series A in July 2026 to build its first commercial demonstration facility
  in France. Syntetica is a materials-science and manufacturing company; as of this
  enrichment pass it publishes no public API, developer portal, SDKs, or machine-readable
  API surface.'
